# DRAFT — NOT SHIPPABLE. The required "Bills and Topics" selection is unknown (see evidence.md).
contact_form:
  steps:
    - visit: 'https://comments.house.texas.gov/home'
    - wait: 10
    - fill_in:
        - name: 'input[formcontrolname="firstName"]'
          value: $NAME_FIRST
          required: true
          options:
            safe_fill_in: true
            max_length: 50
        - name: 'input[formcontrolname="lastName"]'
          value: $NAME_LAST
          required: true
          options:
            safe_fill_in: true
            max_length: 50
        - name: 'input[formcontrolname="address1"]'
          value: $ADDRESS_STREET
          required: true
          options:
            safe_fill_in: true
            max_length: 500
        - name: 'input[formcontrolname="city"]'
          value: $ADDRESS_CITY
          required: true
          options:
            safe_fill_in: true
            max_length: 100
        - name: 'input[formcontrolname="zip"]'
          value: $ADDRESS_ZIP5
          required: true
          options:
            safe_fill_in: true
            max_length: 10
        - name: 'input[formcontrolname="phone"]'
          value: $PHONE_NO_HYPHENS
          required: true
          options:
            safe_fill_in: true
            max_length: 14
        - name: 'input[formcontrolname="representing"]'
          value: 'self'
          required: true
          options:
            safe_fill_in: true
            max_length: 200
    # State: mat-select[formcontrolname="state"] offers only "Texas" and is pre-selected
    # (payload custom_field_answers.dropdown = "Texas") — no step needed.
    # TODO(operator): select the hearing topic. Open the "Bills and Topics" panel
    # (mat-expansion-panel-header) and click "Select" on the correct topic, or enter a
    # bill number in input[formcontrolname="billSearch"]. The topic is NOT in the payload.
    - fill_in:
        - name: 'textarea[formcontrolname="comments"]'
          value: $MESSAGE
          required: true
          options:
            safe_fill_in: true
            max_length: 3000
    - click_on:
        - value: 'Submit'
          selector: 'button#submit'
          recaptcha: false
          tags: ['submit']
    - wait: 10
  success: null
